<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Comprar Key - Loja</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
    body { background: #0b0b0f; color: #fff; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
    .card { width: 100%; max-width: 420px; background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.08); border-radius: 24px; padding: 28px; }
    h2 { text-align: center; margin-bottom: 24px; font-size: 22px; }
    label { display: block; color: #9ca3af; font-size: 12px; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 6px; }
    select, input { width: 100%; height: 48px; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08); border-radius: 14px; color: #fff; padding: 0 14px; font-size: 14px; margin-bottom: 16px; outline: none; }
    select:focus, input:focus { border-color: #10b981; }
    button { width: 100%; height: 50px; border: 0; border-radius: 14px; background: linear-gradient(135deg, #10b981, #059669); color: #fff; font-weight: 700; font-size: 15px; cursor: pointer; transition: opacity 0.2s; }
    button:hover { opacity: 0.9; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    #result { margin-top: 20px; padding: 16px; border-radius: 16px; background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.06); font-size: 14px; line-height: 1.6; word-break: break-all; min-height: 60px; }
    #result.success { border-color: rgba(16,185,129,0.3); color: #6ee7b7; }
    #result.error { border-color: rgba(239,68,68,0.3); color: #f87171; }
    .key { font-family: monospace; color: #34d399; font-weight: 600; }
    .loading { display: flex; align-items: center; justify-content: center; gap: 8px; color: #9ca3af; }
    .spinner { width: 18px; height: 18px; border: 2px solid #10b981; border-top-color: transparent; border-radius: 50%; animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="card">
    <h2>Comprar Key</h2>

    <label>Plano</label>
    <select id="plan">
      <option value="diario">Diário</option>
      <option value="trial">Trial</option>
      <option value="semanal">Semanal</option>
      <option value="15dias">15 Dias</option>
      <option value="mensal" selected>Mensal</option>
      <option value="trimensal">Trimensal</option>
    </select>

    <label>Email do cliente</label>
    <input type="email" id="email" placeholder="cliente@email.com" />

    <button id="btn" onclick="comprar()">Comprar Key</button>

    <div id="result"></div>
  </div>

  <script>
    const API_KEY = "ebcad5be-209d-42f1-8fd7-715be512c6aa";
    const APP_ID = 1;
    const BASE_URL = "https://vgsellers.lat";

    async function comprar() {
      const plan = document.getElementById("plan").value;
      const email = document.getElementById("email").value.trim();
      const btn = document.getElementById("btn");
      const result = document.getElementById("result");

      if (!email) {
        result.className = "error";
        result.innerHTML = "Preencha o email do cliente.";
        return;
      }

      btn.disabled = true;
      result.className = "";
      result.innerHTML = '<div class="loading"><div class="spinner"></div>Processando...</div>';

      try {
        const res = await fetch(BASE_URL + "/api/reseller/v1/buy", {
          method: "POST",
          headers: {
            "X-Api-Key": API_KEY,
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            appId: APP_ID,
            planName: plan,
            quantity: 1,
            customer: email
          })
        });

        const data = await res.json();

        if (res.ok) {
          result.className = "success";
          result.innerHTML =
            '<div>Compra aprovada</div>' +
            '<div>Key: <span class="key">' + data.keys[0] + '</span></div>' +
            '<div>Plano: ' + data.plan.name + ' (' + data.plan.durationDays + ' dias)</div>' +
            '<div>Custo: ' + data.cost + ' cr</div>' +
            '<div>Saldo restante: ' + data.balanceAfter + ' cr</div>';
        } else {
          result.className = "error";
          result.innerHTML = "Erro: " + (data.error || "falha na compra");
        }
      } catch (err) {
        result.className = "error";
        result.innerHTML = "Erro na conexao: " + err.message;
      } finally {
        btn.disabled = false;
      }
    }
  </script>
</body>
</html>
